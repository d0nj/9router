name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to publish; leave empty to build the selected branch"
        required: false
        type: string
      promote_latest:
        description: "Promote this republish to latest"
        required: false
        default: false
        type: boolean

concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 1

      - name: Validate tag and package versions
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
          PROMOTE_LATEST_INPUT: ${{ inputs.promote_latest && 'true' || 'false' }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const tag = process.env.RELEASE_TAG_INPUT || process.env.RELEASE_TAG;
          const refType = process.env.REF_TYPE || "tag";
          const rootVersion = require("./package.json").version;
          const cliVersion = require("./cli/package.json").version;
          const match = /^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/.exec(tag || "");
          if (!match) {
            console.error(`Expected a Docker-safe semver tag like v0.5.120, got ${tag || "<empty>"}`);
            process.exit(1);
          }
          const version = match[1];
          if (rootVersion !== version || cliVersion !== version) {
            console.error(`Version mismatch: tag=${version} package.json=${rootVersion} cli/package.json=${cliVersion}`);
            process.exit(1);
          }
          const commit = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          const promoteLatest = refType === "tag" || process.env.PROMOTE_LATEST_INPUT === "true";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ncommit=${commit}\npromote_latest=${promoteLatest}\n`);
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            ALPINE_MIRROR=${{ vars.ALPINE_MIRROR || 'dl-cdn.alpinelinux.org' }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org/' }}
          cache-from: type=gha,scope=9router-amd64
          cache-to: type=gha,mode=max,scope=9router-amd64
          provenance: false
          sbom: false

      - name: Promote verified image to latest
        if: steps.release.outputs.promote_latest == 'true'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}

      - name: Smoke test published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          container="9router-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" --publish 20128:20128 "$IMAGE"
          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs "$container" || true
          exit 1

      - name: Publish summary
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
